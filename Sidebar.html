// DESCRIZIONE: Sidebar pulita e riorganizzata.

-->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <style>
      :root { --primary: #1a73e8; --primary-dark: #185abc; --warn: #fbbc04; --ok: #1e8e3e; --err: #d93025; --bg-light: #f8f9fa; }
      body { padding: 12px; font-family: 'Roboto', Arial, sans-serif; }
      h4 { font-size: 1.2em; color: #202124; margin-bottom: 12px; }
      h5 { font-size: 1.1em; color: var(--primary); border-bottom: 1px solid #ddd; padding-bottom: 5px; margin: 18px 0 10px; }
      .block { margin-bottom: 10px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
      .row button, .block button { width: 100%; }
      button { background-color: #f8f9fa; color: #202124; border: 1px solid #dadce0; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
      button:hover { background-color: #e8eaed; }
      button.btn-primary, button[style*="background-color: #1a73e8"] { background-color: #1a73e8 !important; color: white !important; border: none !important; }
      button.btn-success, button[style*="background-color: #34a853"] { background-color: #34a853 !important; color: white !important; border: none !important; }
      button:hover.btn-primary, button[style*="background-color: #1a73e8"]:hover { background-color: #185abc !important; }
      button:hover.btn-success, button[style*="background-color: #34a853"]:hover { background-color: #2d8e47 !important; }

      .info-panel { background-color: var(--bg-light); border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px; margin-bottom: 16px; font-size: 13px; }
      .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
      .info-row:last-child { margin-bottom: 0; }
      .info-value { font-weight: bold; text-align: right; }
      #last-run-info { font-size: 11px; color: #5f6368; text-align: right; margin-top: -4px; }
      #last-run-row { display: none; }

      .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
      .dot-active { background-color: var(--ok); }
      .dot-inactive { background-color: #80868b; }

      .progress-bar-container { display: none; margin-top: 8px; }
      progress { width: 100%; height: 8px; }

      .status { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 4px; background: #f1f3f4; font-size: 13px; margin-bottom: 12px; }
      .spinner { width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: none; }
      .status.busy .spinner { display: inline-block; }
      .status.ok { background-color: #e6f4ea; color: #137333; }
      .status.err { background-color: #fce8e6; color: #a50e0e; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hint { font-size: 11px; color: #666; margin-top: 8px; padding-left: 2px; }

      #continue-btn.highlight { background-color: var(--warn); color: #202124; font-weight: bold; animation: pulse 2s infinite; border: none; }
      @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(251, 188, 4, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(251, 188, 4, 0); } 100% { box-shadow: 0 0 0 0 rgba(251, 188, 4, 0); } }
    </style>
  </head>
  <body>
    <h4>🧊 GELATAMI - Controllo Gestione</h4>

    <div class="info-panel">
      <div class="info-row">
        <span>📁 File Elaborati / Totali:</span>
        <span class="info-value" id="file-counter">-- / --</span>
      </div>
      <div class="info-row">
        <span>⏰ Import Automatico:</span>
        <span class="info-value" id="trigger-status">Verifica...</span>
      </div>
      <div class="info-row" id="last-run-row">
        <span></span>
        <span class="info-value" id="last-run-info"></span>
      </div>
      <div class="progress-bar-container" id="progress-container">
        <progress id="progress-bar" value="0" max="100"></progress>
      </div>
    </div>

    <div class="status" id="statusBar">
      <span class="spinner" id="spinner"></span>
      <span id="statusText">Pronto</span>
    </div>

    <div class="block">
      <h5>📥 Importazione</h5>
      <button id="continue-btn" class="action" onclick="runServerFunction('<?!= App.ui.fn.runContinue ?>')">▶️ Continua Import</button>
      <div class="row">
        <button onclick="runServerFunction('<?!= App.ui.fn.runImportHeaders ?>')">1️⃣ Intestazioni</button>
        <button onclick="runServerFunction('<?!= App.ui.fn.runImportRows ?>')">2️⃣ Righe</button>
      </div>
      <button onclick="runServerFunction('<?!= App.ui.fn.runCreatePdfs ?>')" style="margin-top: 8px;">📄 Genera PDF Mancanti</button>
    </div>

    <div class="block">
      <h5>📊 Report e Analisi</h5>
      <div class="row">
        <button onclick="runServerFunction('<?!= App.ui.fn.runCreateDashboard ?>')">📈 Dashboard</button>
        <button onclick="runServerFunction('<?!= App.ui.fn.runCreatePnlSheet ?>')">📑 P&L</button>
      </div>
      <div class="row">
        <button onclick="runServerFunction('<?!= App.ui.fn.runCreateWarehouse ?>')">📦 Magazzino</button>
        <button onclick="runServerFunction('<?!= App.ui.fn.runReconciliationReport ?>')">🔍 Audit</button>
      </div>
    </div>

    <div class="block">
      <h5>🔧 Manutenzione</h5>
      <button onclick="runServerFunction('<?!= App.ui.fn.runCompleteMaintenance ?>')" style="background-color: #1a73e8; color: white;">✨ Manutenzione Completa</button>
      <p class="hint" style="margin-top: 4px; margin-bottom: 8px;">↑ Filtri, formati, duplicati, integrità</p>
      <div class="row">
        <button onclick="runServerFunction('<?!= App.ui.fn.runSyncSuppliers ?>')">🖨️ Sincronizza Fornitori</button>
        <button onclick="runServerFunction('<?!= App.ui.fn.runSyncCategoriesRetroactive ?>')">🔄 Riallinea Categorie</button>
      </div>
      <div class="row">
        <button onclick="runServerFunction('<?!= App.ui.fn.runMarkDuplicateInvoices ?>')">🟡 Gestisci Duplicati</button>
        <button onclick="runServerFunction('<?!= App.ui.fn.runClearCache ?>')">🧹 Pulisci Cache</button>
      </div>
    </div>

    <div class="block">
      <h5>⚙️ Configurazione</h5>
      <button onclick="runServerFunction('<?!= App.ui.fn.runInitialSetup ?>')">🚀 Setup Iniziale</button>
      <button onclick="openConfigDialog()" style="background-color: #1a73e8; color: white;">⚙️ Impostazioni Sistema</button>
      <button onclick="runServerFunction('DEV_EnsureSheetsAndFormats')" style="background-color: #34a853; color: white;">📋 Verifica Struttura Fogli</button>
      <button onclick="openTriggerDashboard()" style="background-color: #34a853; color: white;">📊 Dashboard Trigger</button>
      <div class="row">
        <button onclick="runServerFunction('<?!= App.ui.fn.runCreateTrigger ?>')">🕐 Attiva Import</button>
        <button onclick="runServerFunction('<?!= App.ui.fn.runDeleteTriggers ?>')">🛑 Disattiva Import</button>
      </div>
    </div>

    <script>
      // Riferimenti UI
      const statusText = document.getElementById('statusText');
      const statusBar = document.getElementById('statusBar');
      const continueBtn = document.getElementById('continue-btn');
      const fileCounterEl = document.getElementById('file-counter');
      const triggerStatusEl = document.getElementById('trigger-status');
      const lastRunInfoEl = document.getElementById('last-run-info');
      const lastRunRowEl = document.getElementById('last-run-row');
      const progressContainer = document.getElementById('progress-container');
      const progressBar = document.getElementById('progress-bar');

      let progressInterval = null;

      window.onload = updateStaticStatus;

      function updateStaticStatus() {
        setStatus('busy', 'Verifica stato...');
        google.script.run
          .withSuccessHandler(status => {
            if (!status || !status.success) {
              setStatus('err', 'Errore verifica stato');
              console.error('Stato ricevuto non valido:', status);
              return;
            }

            const totalFilesDisplay = (typeof status.totalFiles === 'number' && status.totalFiles > 0) ? status.totalFiles : '?';
            fileCounterEl.textContent = `${status.processedFiles} / ${totalFilesDisplay}`;

            if (status.triggerActive) {
              const mins = status.triggerEveryMinutes || 15;
              triggerStatusEl.innerHTML = `<span class="status-dot dot-active"></span>Attivo (ogni ${mins} min)`;
            } else {
              triggerStatusEl.innerHTML = `<span class="status-dot dot-inactive"></span>Non Attivo`;
            }

            if (status.lastRun && status.lastRun !== "Mai eseguito") {
              lastRunInfoEl.textContent = `(Ultima esecuzione: ${status.lastRun})`;
              lastRunRowEl.style.display = 'flex';
            } else {
              lastRunRowEl.style.display = 'none';
            }

            if (status.needsContinue) {
              continueBtn.classList.add('highlight');
              setStatus('ok', 'Ripresa disponibile!');
              setTimeout(() => setStatus('', 'Pronto'), 3000);
            } else {
              continueBtn.classList.remove('highlight');
              setStatus('', 'Pronto');
            }
          })
          .withFailureHandler(err => {
            setStatus('err', 'Errore di comunicazione');
            console.error('Fallimento chiamata getSystemStatus:', err);
          })
          .getSystemStatus();
      }

      function setStatus(mode, text) {
        statusBar.className = 'status';
        if (mode) statusBar.classList.add(mode);
        statusText.textContent = text;
      }

      function setDisabled(disabled) {
        document.querySelectorAll('button').forEach(b => b.disabled = disabled);
      }

      function updateProgress() {
        google.script.run
          .withSuccessHandler(status => {
            if (status && (status.total > 0 || status.message)) {
              if (status.total > 0 && status.current !== undefined) {
                progressContainer.style.display = 'block';
                progressBar.value = status.current;
                progressBar.max = status.total;
              } else {
                progressContainer.style.display = 'none';
              }
              setStatus('busy', status.message || 'In esecuzione...');
            } else if (status === null) {
              // Processo concluso
            }
          })
          .withFailureHandler(err => {
            console.warn('Polling fallito (può essere normale a fine processo):', err);
          })
          .getRunningStatus();
      }

      function runServerFunction(fnName) {
        setDisabled(true);
        setStatus('busy', 'Avvio in corso...');
        continueBtn.classList.remove('highlight');

        progressContainer.style.display = 'none';
        progressBar.value = 0;
        progressBar.max = 100;

        if (progressInterval === null) {
          progressInterval = setInterval(updateProgress, 1500);
          updateProgress();
        }

        google.script.run
          .withSuccessHandler(() => {
            clearInterval(progressInterval);
            progressInterval = null;
            progressContainer.style.display = 'none';
            setStatus('ok', 'Operazione completata');
            setDisabled(false);
            setTimeout(() => updateStaticStatus(), 500);
          })
          .withFailureHandler(err => {
            clearInterval(progressInterval);
            progressInterval = null;
            progressContainer.style.display = 'none';
            console.error('Errore dall\'esecuzione server:', err);
            const msg = (err && err.message) ? err.message : 'Operazione fallita.';
            setStatus('err', 'Errore: ' + msg.split('\n')[0]);
            setDisabled(false);
            setTimeout(() => updateStaticStatus(), 500);
          })
          [fnName]();
      }

      function openConfigDialog() {
        setStatus('busy', 'Apertura configurazione...');
        google.script.run
          .withSuccessHandler(() => {
            setStatus('ok', 'Dialog aperto');
            setTimeout(() => setStatus('', 'Pronto'), 2000);
          })
          .withFailureHandler(err => {
            setStatus('err', 'Errore: ' + (err.message || 'Impossibile aprire dialog'));
          })
          .runConfigDialog();
      }

      function openTriggerDashboard() {
        setStatus('busy', 'Apertura dashboard trigger...');
        google.script.run
          .withSuccessHandler(() => {
            setStatus('ok', 'Dashboard aperta');
            setTimeout(() => setStatus('', 'Pronto'), 2000);
          })
          .withFailureHandler(err => {
            setStatus('err', 'Errore: ' + (err.message || 'Foglio non trovato'));
          })
          .openTriggerStatusSheet();
      }
    </script>
  </body>
</html>
