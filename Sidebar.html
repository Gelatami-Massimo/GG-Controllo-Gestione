// DESCRIZIONE: Sidebar completamente ridisegnata con layout a griglia e testi brevi.
// =============================================================
-->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <style>
      :root { 
        --primary: #1a73e8; --primary-dark: #185abc; 
        --success: #34a853; --success-dark: #2d8e47;
        --warn: #fbbc04; --warn-dark: #f9ab00;
        --error: #d93025; 
        --bg-light: #f8f9fa; --bg-section: #ffffff;
        --text-primary: #202124; --text-secondary: #5f6368;
        --border: #dadce0;
      }
      
      body { 
        padding: 10px; 
        font-family: 'Roboto', Arial, sans-serif; 
        font-size: 13px;
        color: var(--text-primary);
        background: #fff;
      }
      
      h4 { 
        font-size: 1.1em; 
        color: var(--text-primary); 
        margin: 0 0 10px 0; 
        font-weight: 500;
      }
      
      /* Info Panel */
      .info-panel { 
        background: var(--bg-light); 
        border: 1px solid var(--border); 
        border-radius: 6px; 
        padding: 8px; 
        margin-bottom: 10px; 
        font-size: 12px; 
      }
      .info-row { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 4px; 
      }
      .info-row:last-child { margin-bottom: 0; }
      .info-value { font-weight: 600; text-align: right; }
      #last-run-info { font-size: 10px; color: var(--text-secondary); text-align: right; margin-top: -2px; }
      #last-run-row { display: none; }
      
      .status-dot { 
        display: inline-block; 
        width: 8px; height: 8px; 
        border-radius: 50%; 
        margin-right: 5px; 
        vertical-align: middle; 
      }
      .dot-active { background-color: var(--success); }
      .dot-inactive { background-color: #80868b; }
      
      /* Progress Bar */
      .progress-bar-container { display: none; margin-top: 6px; }
      progress { width: 100%; height: 6px; border-radius: 3px; }
      
      /* Status Bar */
      .status { 
        display: flex; 
        align-items: center; 
        gap: 6px; 
        padding: 6px 8px; 
        border-radius: 4px; 
        background: var(--bg-light); 
        font-size: 12px; 
        margin-bottom: 10px; 
      }
      .spinner { 
        width: 12px; height: 12px; 
        border: 2px solid rgba(0,0,0,0.1); 
        border-top-color: var(--primary); 
        border-radius: 50%; 
        animation: spin .8s linear infinite; 
        display: none; 
      }
      .status.busy .spinner { display: inline-block; }
      .status.ok { background-color: #e6f4ea; color: #137333; }
      .status.err { background-color: #fce8e6; color: #a50e0e; }
      @keyframes spin { to { transform: rotate(360deg); } }
      
      /* Section Structure */
      .gg-section { 
        margin-bottom: 12px; 
        padding: 10px; 
        border-radius: 6px; 
        background: var(--bg-section);
        border: 1px solid var(--border);
      }
      .gg-section h5 { 
        font-size: 0.95em; 
        font-weight: 600;
        color: var(--primary); 
        margin: 0 0 4px 0; 
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .gg-section-desc { 
        font-size: 11px; 
        color: var(--text-secondary); 
        margin: 0 0 8px 0; 
        line-height: 1.3;
      }
      
      /* Buttons Grid */
      .gg-buttons-grid { 
        display: grid; 
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); 
        gap: 6px; 
      }
      .gg-buttons-grid.full { 
        grid-template-columns: 1fr; 
      }
      
      button { 
        background: #fff;
        color: var(--text-primary); 
        border: 1px solid var(--border); 
        padding: 8px 10px; 
        border-radius: 4px; 
        cursor: pointer; 
        font-size: 13px; 
        font-weight: 500;
        text-align: center;
        transition: all 0.15s ease;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      button:hover { 
        background: var(--bg-light);
        border-color: var(--primary);
      }
      button:active {
        transform: scale(0.98);
      }
      
      /* Button Variants */
      button.btn-primary { 
        background: var(--primary); 
        color: white; 
        border: none;
      }
      button.btn-primary:hover { 
        background: var(--primary-dark);
      }
      
      button.btn-success { 
        background: var(--success); 
        color: white; 
        border: none;
      }
      button.btn-success:hover { 
        background: var(--success-dark);
      }
      
      button.btn-warn { 
        background: var(--warn); 
        color: var(--text-primary); 
        border: none;
        font-weight: 600;
      }
      button.btn-warn:hover { 
        background: var(--warn-dark);
      }
      
      #continue-btn.highlight { 
        animation: pulse 2s infinite; 
      }
      @keyframes pulse { 
        0% { box-shadow: 0 0 0 0 rgba(251, 188, 4, 0.7); } 
        70% { box-shadow: 0 0 0 8px rgba(251, 188, 4, 0); } 
        100% { box-shadow: 0 0 0 0 rgba(251, 188, 4, 0); } 
      }
    </style>
  </head>
  <body>
    <h4>🧊 GELATAMI</h4>

    <div class="info-panel">
      <div class="info-row">
        <span>📁 File:</span>
        <span class="info-value" id="file-counter">-- / --</span>
      </div>
      <div class="info-row">
        <span>⏰ Auto:</span>
        <span class="info-value" id="trigger-status">...</span>
      </div>
      <div class="info-row" id="last-run-row">
        <span></span>
        <span class="info-value" id="last-run-info"></span>
      </div>
      <div class="progress-bar-container" id="progress-container">
        <progress id="progress-bar" value="0" max="100"></progress>
      </div>
    </div>

    <div class="status" id="statusBar">
      <span class="spinner" id="spinner"></span>
      <span id="statusText">Pronto</span>
    </div>

    <!-- 📥 IMPORT -->
    <section class="gg-section gg-import">
      <h5>📥 Import</h5>
      <p class="gg-section-desc">Importazione fatture XML e generazione PDF</p>
      <div class="gg-buttons-grid full">
        <button id="continue-btn" class="btn-warn" onclick="runServerFunction('<?!= App.ui.fn.runContinue ?>')" title="Riprendi import interrotto">▶ Continua</button>
      </div>
      <div class="gg-buttons-grid">
        <button onclick="runServerFunction('<?!= App.ui.fn.runImportHeaders ?>')" title="Importa solo intestazioni fatture">Intestazioni</button>
        <button onclick="runServerFunction('<?!= App.ui.fn.runImportRows ?>')" title="Importa righe prodotti">Righe</button>
      </div>
      <div class="gg-buttons-grid full">
        <button onclick="runServerFunction('<?!= App.ui.fn.runCreatePdfs ?>')" title="Genera PDF mancanti">📄 PDF mancanti</button>
      </div>
    </section>

    <!-- 📊 ANALISI -->
    <section class="gg-section gg-analytics">
      <h5>📊 Analisi</h5>
      <p class="gg-section-desc">Report, dashboard e analisi dati</p>
      <div class="gg-buttons-grid">
        <button onclick="runServerFunction('<?!= App.ui.fn.runCreateDashboard ?>')" title="Genera dashboard riepilogativa">Dashboard</button>
        <button onclick="runServerFunction('<?!= App.ui.fn.runCreatePnlSheet ?>')" title="Conto economico">P&L</button>
        <button onclick="runServerFunction('<?!= App.ui.fn.runCreateWarehouse ?>')" title="Report magazzino">Magazzino</button>
        <button onclick="runServerFunction('buildMagazzinoIngredientiByYear')" title="Report magazzino aggregato per anno e ingrediente">Mag. Ingred.</button>
        <button onclick="runServerFunction('<?!= App.ui.fn.runReconciliationReport ?>')" title="Report di audit e integrità">Audit</button>
      </div>
    </section>

    <!-- 🔧 MANUTENZIONE -->
    <section class="gg-section gg-maintenance">
      <h5>🔧 Manutenzione</h5>
      <p class="gg-section-desc">Ottimizzazione e pulizia dati</p>
      <div class="gg-buttons-grid">
        <button class="btn-primary" onclick="runServerFunction('<?!= App.ui.fn.runCompleteMaintenance ?>')" title="Esegue tutte le operazioni di manutenzione">Man. completa</button>
        <button onclick="runServerFunction('<?!= App.ui.fn.runSyncSuppliers ?>')" title="Sincronizza fornitori">Fornitori</button>
        <button onclick="runServerFunction('<?!= App.ui.fn.runSyncCategoriesRetroactive ?>')" title="Riallinea categorie prodotti">Categorie</button>
        <button onclick="runServerFunction('<?!= App.ui.fn.runMarkDuplicateInvoices ?>')" title="Gestisci fatture duplicate">Duplicati</button>
        <button onclick="runServerFunction('<?!= App.ui.fn.runClearCache ?>')" title="Pulisci cache di sistema">Cache</button>
      </div>
    </section>

    <!-- ⚙️ CONFIGURAZIONE -->
    <section class="gg-section gg-config">
      <h5>⚙️ Config</h5>
      <p class="gg-section-desc">Impostazioni e gestione trigger</p>
      <div class="gg-buttons-grid">
        <button onclick="runServerFunction('<?!= App.ui.fn.runInitialSetup ?>')" title="Setup iniziale fogli">Setup</button>
        <button class="btn-primary" onclick="openConfigDialog()" title="Impostazioni sistema">Impostazioni</button>
        <button class="btn-success" onclick="runServerFunction('DEV_EnsureSheetsAndFormats')" title="Verifica e aggiorna struttura fogli">Struttura</button>
        <button class="btn-success" onclick="openTriggerDashboard()" title="Dashboard trigger automatici">Trigger dash</button>
      </div>
      <div class="gg-buttons-grid">
        <button onclick="runServerFunction('<?!= App.ui.fn.runCreateTrigger ?>')" title="Attiva import automatico ogni 15 min">Attiva import</button>
        <button onclick="runServerFunction('<?!= App.ui.fn.runDeleteTriggers ?>')" title="Disattiva tutti i trigger">Stop import</button>
      </div>
    </section>

    <script>
      // Riferimenti UI
      const statusText = document.getElementById('statusText');
      const statusBar = document.getElementById('statusBar');
      const continueBtn = document.getElementById('continue-btn');
      const fileCounterEl = document.getElementById('file-counter');
      const triggerStatusEl = document.getElementById('trigger-status');
      const lastRunInfoEl = document.getElementById('last-run-info');
      const lastRunRowEl = document.getElementById('last-run-row');
      const progressContainer = document.getElementById('progress-container');
      const progressBar = document.getElementById('progress-bar');

      let progressInterval = null;

      window.onload = updateStaticStatus;

      function updateStaticStatus() {
        setStatus('busy', 'Verifica stato...');
        google.script.run
          .withSuccessHandler(status => {
            if (!status || !status.success) {
              setStatus('err', 'Errore verifica stato');
              console.error('Stato ricevuto non valido:', status);
              return;
            }

            const totalFilesDisplay = (typeof status.totalFiles === 'number' && status.totalFiles > 0) ? status.totalFiles : '?';
            fileCounterEl.textContent = `${status.processedFiles} / ${totalFilesDisplay}`;

            if (status.triggerActive) {
              const mins = status.triggerEveryMinutes || 15;
              triggerStatusEl.innerHTML = `<span class="status-dot dot-active"></span>Attivo (ogni ${mins} min)`;
            } else {
              triggerStatusEl.innerHTML = `<span class="status-dot dot-inactive"></span>Non Attivo`;
            }

            if (status.lastRun && status.lastRun !== "Mai eseguito") {
              lastRunInfoEl.textContent = `(Ultima esecuzione: ${status.lastRun})`;
              lastRunRowEl.style.display = 'flex';
            } else {
              lastRunRowEl.style.display = 'none';
            }

            if (status.needsContinue) {
              continueBtn.classList.add('highlight');
              setStatus('ok', 'Ripresa disponibile!');
              setTimeout(() => setStatus('', 'Pronto'), 3000);
            } else {
              continueBtn.classList.remove('highlight');
              setStatus('', 'Pronto');
            }
          })
          .withFailureHandler(err => {
            setStatus('err', 'Errore di comunicazione');
            console.error('Fallimento chiamata getSystemStatus:', err);
          })
          .getSystemStatus();
      }

      function setStatus(mode, text) {
        statusBar.className = 'status';
        if (mode) statusBar.classList.add(mode);
        statusText.textContent = text;
      }

      function setDisabled(disabled) {
        document.querySelectorAll('button').forEach(b => b.disabled = disabled);
      }

      function updateProgress() {
        google.script.run
          .withSuccessHandler(status => {
            if (status && (status.total > 0 || status.message)) {
              if (status.total > 0 && status.current !== undefined) {
                progressContainer.style.display = 'block';
                progressBar.value = status.current;
                progressBar.max = status.total;
              } else {
                progressContainer.style.display = 'none';
              }
              setStatus('busy', status.message || 'In esecuzione...');
            } else if (status === null) {
              // Processo concluso
            }
          })
          .withFailureHandler(err => {
            console.warn('Polling fallito (può essere normale a fine processo):', err);
          })
          .getRunningStatus();
      }

      function runServerFunction(fnName) {
        setDisabled(true);
        setStatus('busy', 'Avvio in corso...');
        continueBtn.classList.remove('highlight');

        progressContainer.style.display = 'none';
        progressBar.value = 0;
        progressBar.max = 100;

        if (progressInterval === null) {
          progressInterval = setInterval(updateProgress, 1500);
          updateProgress();
        }

        google.script.run
          .withSuccessHandler(() => {
            clearInterval(progressInterval);
            progressInterval = null;
            progressContainer.style.display = 'none';
            setStatus('ok', 'Operazione completata');
            setDisabled(false);
            setTimeout(() => updateStaticStatus(), 500);
          })
          .withFailureHandler(err => {
            clearInterval(progressInterval);
            progressInterval = null;
            progressContainer.style.display = 'none';
            console.error('Errore dall\'esecuzione server:', err);
            const msg = (err && err.message) ? err.message : 'Operazione fallita.';
            setStatus('err', 'Errore: ' + msg.split('\n')[0]);
            setDisabled(false);
            setTimeout(() => updateStaticStatus(), 500);
          })
          [fnName]();
      }

      function openConfigDialog() {
        setStatus('busy', 'Apertura configurazione...');
        google.script.run
          .withSuccessHandler(() => {
            setStatus('ok', 'Dialog aperto');
            setTimeout(() => setStatus('', 'Pronto'), 2000);
          })
          .withFailureHandler(err => {
            setStatus('err', 'Errore: ' + (err.message || 'Impossibile aprire dialog'));
          })
          .runConfigDialog();
      }

      function openTriggerDashboard() {
        setStatus('busy', 'Apertura dashboard trigger...');
        google.script.run
          .withSuccessHandler(() => {
            setStatus('ok', 'Dashboard aperta');
            setTimeout(() => setStatus('', 'Pronto'), 2000);
          })
          .withFailureHandler(err => {
            setStatus('err', 'Errore: ' + (err.message || 'Foglio non trovato'));
          })
          .openTriggerStatusSheet();
      }
    </script>
  </body>
</html>
